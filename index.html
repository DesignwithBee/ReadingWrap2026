<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cool Girl Literature — Reading Wrap 2026</title>
<meta name="description" content="Cool Girl Literature: my 2026 reading wrap. For the wellread and still curious.">
<link rel="icon" href="assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style>
body{margin:0;background:#2a0608;color:#e9dcbc;font-family:'Cormorant Garamond',Georgia,serif}
a{color:#e9dcbc}a:hover{color:#fff}
.cgl-frame{position:absolute;background:url(assets/frame.webp) center/100% 100% no-repeat;filter:drop-shadow(0 12px 18px rgba(0,0,0,.55))}
.screen{position:absolute;inset:3.8% 4.9%;border-radius:3%;overflow:hidden;background:linear-gradient(160deg,#3b0d10,#1b0405)}
.screen img{width:100%;height:100%;object-fit:cover;display:block}
.stars{position:absolute;top:100%;left:0;right:0;margin-top:8px;display:flex;justify-content:center;gap:2px;font-size:18px;line-height:1}
.stars .off{opacity:.22;filter:grayscale(1)}
@keyframes cgl-spin{from{transform:translateZ(var(--r)) rotateX(-6deg) rotateY(0)}to{transform:translateZ(var(--r)) rotateX(-6deg) rotateY(-360deg)}}
.cgl-ring{position:absolute;left:50%;top:50%;transform-style:preserve-3d;animation:cgl-spin 60s linear infinite}
.cgl-ring:hover{animation-play-state:paused}
@keyframes cgl-type{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% 0 -20% 0)}}
@keyframes cgl-caret{0%,100%{border-color:#e9dcbc}50%{border-color:transparent}}
@keyframes cgl-caret-off{to{border-color:transparent}}
@keyframes cgl-rise{from{transform:translateY(240px) scale(1.15)}to{transform:none}}
@keyframes cgl-in{from{opacity:0;transform:translateY(40px) scale(.92)}to{opacity:1;transform:none}}
.cgl-title{position:relative;z-index:2;margin:72px 0 6px;font-family:'UnifrakturMaguntia',serif;font-weight:400;font-size:clamp(44px,8vw,104px);line-height:1;text-align:center;text-shadow:0 4px 24px rgba(0,0,0,.6);animation:cgl-rise .9s cubic-bezier(.22,1,.36,1) 2.6s both}
.cgl-type{display:inline-block;padding-right:6px;border-right:4px solid #e9dcbc;animation:cgl-type 2.2s steps(20,end) .3s both,cgl-caret .7s step-end 0s 4,cgl-caret-off .01s 2.8s forwards}
.cgl-books{position:relative;width:100%;height:516px;margin-top:24px;perspective:1400px;animation:cgl-in 1.1s cubic-bezier(.22,1,.36,1) 3.3s both}
.cgl-after{animation:cgl-in .9s ease 4.1s both}
.cgl-shell{display:flex;min-height:100vh}
.cgl-nav{flex:none;width:248px;box-sizing:border-box;position:relative;z-index:5;overflow:hidden;transition:width .35s cubic-bezier(.22,1,.36,1),padding .35s;
  background:radial-gradient(ellipse 120% 30% at 0% 0%,rgba(74,94,52,.55),transparent 70%),radial-gradient(ellipse 90% 22% at 100% 100%,rgba(60,84,44,.5),transparent 70%),radial-gradient(ellipse 60% 18% at 0% 62%,rgba(84,104,58,.35),transparent 70%),#1b0405;
  border-right:1px solid rgba(233,220,188,.15);padding:32px 22px;display:flex;flex-direction:column;gap:28px}
.cgl-nav>*{position:relative;z-index:1}.cgl-nav>.cgl-vine{position:absolute;z-index:0;pointer-events:none}
.cgl-nav.is-collapsed{width:84px;padding:24px 14px}.cgl-nav.is-collapsed .cgl-links,.cgl-nav.is-collapsed .cgl-home{display:none}
.cgl-home{display:flex}
.cgl-logo{width:100%;max-width:204px;height:auto;display:block;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.cgl-links{display:flex;flex-direction:column;gap:4px}
.cgl-link{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:#e9dcbc;text-decoration:none;font-size:19px;font-weight:600}
.cgl-link:hover{background:rgba(233,220,188,.1);color:#fff}
.cgl-link:focus-visible,.cgl-toggle:focus-visible{outline:2px solid #e9dcbc;outline-offset:2px}
.cgl-toggle{padding:0;display:inline-flex;align-self:flex-start;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;border:1px solid rgba(233,220,188,.3);background:transparent;cursor:pointer}
.cgl-toggle img{width:34px;height:auto;display:block;filter:brightness(1.6) sepia(.3)}
.cgl-main{flex:1 1 auto;min-width:0;position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:56px 16px 40px;box-sizing:border-box;background:radial-gradient(ellipse at 50% 40%,#4a1215 0%,#2a0608 70%)}
.deco{position:absolute;pointer-events:none}
.hover{position:relative;min-height:30px;margin:0 0 8px;font-size:22px;font-weight:600;text-align:center}
.tag{position:relative;margin:0;font-style:italic;font-size:36px;color:#c8b48e;text-align:center}
@media (max-width:760px){
  .cgl-shell{flex-direction:column}
  .cgl-nav,.cgl-nav.is-collapsed{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-right:0;border-bottom:1px solid rgba(233,220,188,.15)}
  .cgl-nav.is-collapsed .cgl-home{display:flex}
  .cgl-toggle{align-self:center;order:2;width:56px;height:48px}
  .cgl-links{display:none;width:100%;order:3}.cgl-nav.is-collapsed .cgl-links{display:flex}
  .cgl-logo{max-width:52px;box-shadow:none}
  .cgl-books{height:400px}.tag{font-size:24px}
}
@media (prefers-reduced-motion:reduce){.cgl-ring,.cgl-title,.cgl-type,.cgl-books,.cgl-after{animation:none}.cgl-type{border-right-color:transparent}}
</style>
</head>
<body>
<div class="cgl-shell">
<nav class="cgl-nav" id="nav" aria-label="Main menu">
  <img class="cgl-vine" src="assets/vines.webp" alt="" aria-hidden="true" style="top:-20px;left:-40px;width:330px;opacity:.38">
  <img class="cgl-vine" src="assets/branch.webp" alt="" aria-hidden="true" style="top:46%;right:-150px;width:340px;transform:rotate(-78deg);opacity:.45">
  <img class="cgl-vine" src="assets/branch.webp" alt="" aria-hidden="true" style="bottom:-40px;left:-120px;width:360px;transform:scaleX(-1) rotate(-14deg);opacity:.5">
  <button class="cgl-toggle" id="toggle" type="button" aria-label="Toggle menu" aria-expanded="false"><img src="assets/books.webp" alt="" aria-hidden="true"></button>
  <a class="cgl-home" href="#top" aria-label="Cool Girl Literature home"><img class="cgl-logo" src="assets/logo.webp" alt="Cool Girl Lit"></a>
  <div class="cgl-links">
    <a class="cgl-link" href="https://coolgirllit.substack.com/" target="_blank" rel="noopener">My Substack<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a>
    <a class="cgl-link" href="https://www.goodreads.com/beejojoreads" target="_blank" rel="noopener">My Goodreads<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a>
    <a class="cgl-link" href="https://fable.co/club/cool-girl-literature-with-bee-428349908745" target="_blank" rel="noopener">My Fable Book Club<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a>
    <img src="assets/leaves.webp" alt="" aria-hidden="true" style="width:100%;max-width:220px;height:auto;margin:18px auto 0;display:block;opacity:.35;pointer-events:none">
  </div>
</nav>
<main id="top" class="cgl-main">
  <img class="deco" src="assets/dome.webp" alt="" aria-hidden="true" style="left:50%;top:0;height:911px;width:1060px;transform:translateX(-50%);opacity:.22;object-fit:cover;object-position:50% 6%">
  <img class="deco" src="assets/vines.webp" alt="" aria-hidden="true" style="top:-34px;left:50%;transform:translateX(-50%);width:1145px;height:934px;opacity:.42;object-fit:cover">
  <img class="deco" src="assets/branch.webp" alt="" aria-hidden="true" style="top:-40px;left:-51px;width:690px;transform:rotate(8deg);opacity:.85">
  <img class="deco" src="assets/branch.webp" alt="" aria-hidden="true" style="top:-66px;right:-13px;width:641px;transform:scaleX(-1) rotate(6deg);opacity:.85">
  <h1 class="cgl-title"><span class="cgl-type">Cool Girl Literature</span></h1>
  <div class="cgl-books" aria-label="Book carousel"><div class="cgl-ring" id="ring"></div></div>
  <div class="hover cgl-after" id="hover" aria-live="polite"></div>
  <p class="tag cgl-after">For the wellread and still curious</p>
</main>
</div>
<script>
{
const books = [
  ['A Court of Thorns and Roses by Sarah J. Maas','01.webp',5],
  ['Alchemised by SenLinYu','02.webp',3],
  ['The Ballad of Songbirds and Snakes by Suzanne Collins','03.webp',4],
  ['The Book of Azrael by Amber V. Nicole','04.webp',5],
  ['Dracula (Audible) by Bram Stoker, performed by Jonathan Bailey and Ella Purnell','05.webp',5],
  ['Dracula (Manga Classics) by Bram Stoker','06.webp',4],
  ['East of Eden by John Steinbeck','07.webp',5],
  ['Fahrenheit 451 by Ray Bradbury','08.webp',1],
  ['Fruit Fly by Josh Silver','09.webp',5],
  ['Hex Hall by Rachel Hawkins','10.webp',5],
  ['Hex Hall #2: Demonglass by Rachel Hawkins','11.webp',4],
  ['Long Live Evil by Sarah Rees Brennan','12.webp',5],
  ['The Metamorphosis by Franz Kafka','13.webp',4],
  ["My Husband's Wife by Alice Feeney",'14.webp',4],
  ['Percy Jackson: The Lightning Thief by Rick Riordan','15.webp',5],
  ['Rebecca by Daphne du Maurier','16.webp',4],
  ['Sunrise on the Reaping by Suzanne Collins','17.webp',4],
  ['The Hunger Games by Suzanne Collins','18.jpg',4],
  ['Tourist Season by Brynne Weaver','19.webp',5],
  ['Verity by Colleen Hoover','20.webp',3],
  ['Yellowface by R.F. Kuang','21.webp',4],
  ['Yesteryear by Caro Claire Burke','22.webp',4],
  ['Martyr! by Kaveh Akbar','23.webp',5]
];
const ring = document.getElementById('ring'), hover = document.getElementById('hover');
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function build(){
  const n = books.length, w = innerWidth < 760 ? 110 : 150, h = Math.round(w*800/614);
  const r = Math.round((w*1.08)/(2*Math.tan(Math.PI/n)));
  ring.style.setProperty('--r', -r+'px');
  ring.innerHTML = books.map(([t,f,s],i)=>{
    const label = esc(t), stars=[1,2,3,4,5].map(k=>`<span class="${k<=s?'':'off'}" aria-hidden="true">⭐</span>`).join('');
    return `<div class="cgl-frame" style="width:${w}px;height:${h}px;left:${-w/2}px;top:${-h/2}px;transform:rotateY(${i*360/n}deg) translateZ(${r}px)">
      <div class="screen" data-i="${i}" title="${label}"><img src="assets/covers/${f}" alt="${label}" loading="lazy"></div>
      <div class="stars" role="img" aria-label="${s} out of 5 stars" title="${s} out of 5 stars">${stars}</div></div>`;
  }).join('');
}
build();
let lastW = innerWidth; addEventListener('resize', ()=>{ if((innerWidth<760)!==(lastW<760)){ lastW=innerWidth; build(); } });
ring.addEventListener('mouseover', e=>{ const s=e.target.closest('.screen'); if(s){ const b=books[+s.dataset.i]; hover.textContent = b[0]+' · '+b[2]+' out of 5 stars'; }});
ring.addEventListener('mouseout', e=>{ if(e.target.closest('.screen')) hover.textContent=''; });
const nav = document.getElementById('nav'), tg = document.getElementById('toggle');
tg.addEventListener('click', ()=>{ const c = nav.classList.toggle('is-collapsed'); tg.setAttribute('aria-expanded', String(c)); });
}
</script>
</body>
</html>
